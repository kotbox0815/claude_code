{% extends "base.html" %}
{% block content %}
<h1>Import-Historie</h1>

<table id="reports-table">
  <thead>
    <tr><th>ID</th><th>Dateiname</th><th>Importiert am</th><th>Zeilen</th><th></th></tr>
  </thead>
  <tbody></tbody>
</table>

<div class="danger-zone">
  <h2>Datenbank leeren</h2>
  <p>Entfernt alle importierten Reports und Einträge unwiderruflich.</p>
  <button id="reset-db-btn" class="btn-danger">Alle Daten löschen</button>
  <p id="reset-result"></p>
</div>

<script>
async function loadReports() {
  const res = await fetch("/api/reports");
  const reports = await res.json();
  const tbody = document.querySelector("#reports-table tbody");
  tbody.innerHTML = "";
  for (const r of reports) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${r.id}</td>
      <td>${r.filename}</td>
      <td>${new Date(r.imported_at).toLocaleString("de-DE")}</td>
      <td>${r.row_count}</td>
      <td><a href="/?report_id=${r.id}">Einträge ansehen</a></td>
    `;
    tbody.appendChild(tr);
  }
}

document.getElementById("reset-db-btn").addEventListener("click", async () => {
  const confirmed = window.confirm(
    "Wirklich alle Reports und Einträge unwiderruflich löschen?\n\nDieser Vorgang kann nicht rückgängig gemacht werden."
  );
  if (!confirmed) return;

  const res = await fetch("/api/reset", { method: "DELETE" });
  const data = await res.json();
  document.getElementById("reset-result").textContent = data.message || "Datenbank geleert.";
  loadReports();
});

loadReports();
</script>
{% endblock %}
